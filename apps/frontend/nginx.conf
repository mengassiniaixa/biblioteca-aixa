server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta no-archivo cae en index.html para que react-router resuelva
  location / {
    try_files $uri $uri/ /index.html;
  }

  # cache largo para assets con hash de vite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
